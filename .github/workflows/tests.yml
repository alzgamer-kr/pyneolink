name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff checks
        run: |
          python -m ruff check pyneolink tests examples
          python -m ruff format pyneolink tests examples --check
          python -m ruff check pyneolink --select D101,D102,D103,D107,D201,D202,D204,D205,D209,D210,D211,D300,D400,D403,D419

      - name: Run tests
        run: python -m pytest

      - name: Test optional push dependencies without network access
        run: |
          python -m pip install ".[push]"
          python -c "import firebase_messaging, http_ece"
          python -m pytest tests/test_push_fcm_crypto_roundtrip.py tests/test_push_gcm_retry.py

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*
