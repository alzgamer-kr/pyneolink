name: Publish Python package

on:
  release:
    types: [published]

jobs:
  validate-release:
    name: Validate release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Match tag and changelog to package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          root = pathlib.Path.cwd()
          version = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          if f"## {version}" not in (root / "CHANGELOG.md").read_text().splitlines():
              raise SystemExit(f"Missing finalized changelog section for {version}")
          PY

  tests:
    name: Release regression matrix
    needs: validate-release
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build-cli-assets:
    name: Build CLI assets (${{ matrix.name }})
    needs: tests
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset-base-name: pyneolink-cli-windows
            asset-extension: .exe
          - name: Linux
            os: ubuntu-latest
            asset-base-name: pyneolink-cli-linux
            asset-extension: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Linux audio library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 portaudio19-dev

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ".[voice,push]"

      - name: Resolve asset name
        shell: bash
        run: |
          VERSION="$(python -c 'from importlib.metadata import version; print(version("pyneolink"))')"
          ASSET_STEM="${{ matrix.asset-base-name }}-${VERSION}"
          ASSET_NAME="${ASSET_STEM}${{ matrix.asset-extension }}"
          echo "ASSET_STEM=${ASSET_STEM}" >> "$GITHUB_ENV"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_PATH=dist-cli/${ASSET_NAME}" >> "$GITHUB_ENV"

      - name: Build CLI asset
        run: |
          python -m PyInstaller --clean --onefile --collect-all firebase_messaging --hidden-import sqlalchemy.dialects.sqlite.pysqlite --name "${{ env.ASSET_STEM }}" --distpath dist-cli --workpath build-cli --specpath build-cli-spec pyneolink/cli.py

      - name: Verify CLI asset on Windows
        if: runner.os == 'Windows'
        run: |
          & "${env:ASSET_PATH}" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ASSET_PATH}" voice --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ASSET_PATH}" push watch --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ASSET_PATH}" --config config.example.json --camera Home-Front --storage-dir .tmp/cli-smoke push read --no-sync --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify CLI asset on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x "${ASSET_PATH}"
          "${ASSET_PATH}" --help
          "${ASSET_PATH}" voice --help
          "${ASSET_PATH}" push watch --help
          "${ASSET_PATH}" --config config.example.json --camera Home-Front --storage-dir .tmp/cli-smoke push read --no-sync --json

      - name: Upload CLI asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          overwrite_files: true

  publish:
    name: Build and publish to PyPI
    needs: build-cli-assets
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff checks
        run: |
          python -m ruff check pyneolink tests examples
          python -m ruff format pyneolink tests examples --check

      - name: Run tests
        run: python -m pytest

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
